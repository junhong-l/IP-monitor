name: Build FnNAS IPK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Download fnpack tool
      run: |
        # 下载 fnpack 工具（根据官方文档，使用 Linux 版本）
        # 如果有最新版本，请更新版本号
        wget -O fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.0-linux-amd64
        chmod +x fnpack
        # 验证工具可用
        ./fnpack --version || echo "fnpack downloaded"

    - name: Build Go binary for Linux
      run: |
        # 编译为 Linux 可执行文件
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ip-monitor -ldflags="-s -w" .
        
    - name: Prepare application structure
      run: |
        # 确保目标目录存在
        mkdir -p fnnas.ipnotify/app/server
        
        # 复制编译好的可执行文件到 server 目录
        cp ip-monitor fnnas.ipnotify/app/server/
        
        # 添加执行权限
        chmod +x fnnas.ipnotify/app/server/ip-monitor
        
        # 列出文件确认
        ls -lah fnnas.ipnotify/app/server/

    - name: Build IPK package
      run: |
        # 进入项目目录
        cd fnnas.ipnotify
        
        # 使用 fnpack 打包
        ../fnpack build
        
        # 列出生成的文件
        ls -lah

    - name: Upload IPK artifact
      uses: actions/upload-artifact@v4
      with:
        name: fnnas-ipk-package
        path: fnnas.ipnotify/*.ipk
        if-no-files-found: error

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: fnnas.ipnotify/*.ipk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
